# 地点池（GLOSSARY.md「地点」）。和工作清单一样由维护者在这里维护，后台和 .env 都不能改；
# 启动时读入、校验，写错了后端起不来。运行时不查任何地图服务。
#
# Contains data © OpenStreetMap contributors, ODbL
#
# 每个地点一个 [[places]] 段：
#   id        规范标识（小写字母、数字、- 和 _）
#   name      日文原名，动态旁边显示的就是它，和地图、招牌一致，片假名店名照写
#   area      区市町村，消歧、给她参考用，不显示；东京都以外的带县名，只能是神奈川県、千葉県、埼玉県
#   lat, lon  坐标，取自来源（OSM、Wikidata、官方页面），不估
#   category  类别：cafe（咖啡馆·甜品·餐厅）、park（公园·河边）、shrine（神社·寺）、
#             shopping-street（商店街）、fashion-street（杂货·服装街区）、books（书店·图书馆）、
#             mall（商场·车站大楼，含电影院）、seaside（海边·湾岸）、amusement（水族馆·动物园·游乐园）、
#             museum（美术馆·博物馆·天象仪）、night-view（展望台·夜景）、bath（温泉·钱汤）、
#             seasonal（季节名所）、venue（演出场馆）；
#             cafe、books、mall、museum、bath、venue 算室内，下雨下雪只挑这几类
#   note      一句中文，告诉她这是什么地方，她写配图时看它自己写景物
#   checked   核对日期，如 2026-10-31
#   idols     有关的偶像（可选，角色标识的列表）：只给圣地和角色资料里写明的地方
#   source    出处（可选，一行）：圣地写卡面名或［背景］名加考据链接；有 source 的就是圣地
#   seasons   只在哪些季节挑（可选，只给明显分季节的）：spring（3–5 月）、summer（6–8 月）、
#             autumn（9–11 月）、winter（12–2 月）的列表，按东京的月份
#   slots     只在哪些时段挑（可选，比如夜景只排晚上）：morning（上午）、afternoon（下午）、
#             evening（晚上）的列表，按东京时间看发的那一刻；写了的深夜不挑
#   venues    演出场馆在 world.json 里演出那天的场馆名（可选，只给 venue）：和 name 不一样、
#             或者有几种写法时写全；不写就是 name。只在她往年今天有演出时挑
#
# 便利店、家庭餐厅、学校、私宅、夜生活街区不收。

