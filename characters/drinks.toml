# 饮品目录（GLOSSARY.md「饮品」「材料」）。照搬《VA-11 HALL-A》原版的 28 款：24 款调制、4 款瓶装，
# 不收隐藏的 Flaming Moai。来源是调研分支 research/bar-drinks 的 drinks.csv（代码 drink_a 和配方卡
# 逐条核对）；原版的数据冲突照配方卡改：Piano Man 是 sour，Beer 是 classic。和礼物目录一样由维护者
# 在这里维护，后台和 .env 都不能改；启动时读入、校验，写错了后端起不来。
#
# 每款饮品一个 [[drinks]] 段：
#   id           规范标识（小写字母、数字、- 和 _），英文名的写法，如 sugar-rush
#   name         英文原名：配方书、点单备忘和中文字幕都用它（官方中文版不译饮品名）
#   name_ja      日文版的译名：她的日语台词用
#   short_name   原版的短名，调好后摇酒壶上显示的，不超过 10 个字符
#   flavor       口味：sweet（甜味）、bitter（苦味）、sour（酸味）、spicy（辛辣）、bubbly（发泡）
#   kind         种类：girly（女性化）、manly（男性化）、classic（经典）、classy（时尚）、promo（宣传）
#   description  官方中文描述：调制的是配方卡上引号里的那句，瓶装的是配方书上的小字
#   method       调法：mix（摇不到 5 秒）、blend（摇满 5 秒）或 bottle（瓶装，直接上）
#
# 调制的另有：
#   adelhyde、bronson_extract、powdered_delta、flanergide  四种材料各几份，0–20 的整数
#   karmotrine   Karmotrine 几份，或 "optional"（加 0 份是无酒精的，加几份都还是这一款）
#                五种合计不超过 20 份（可选的那一项算 0）
#   ice、aged    加冰、陈化，true 或 false
#   big          本身就是大杯（可选，默认 false）：没有翻倍的大杯版；不是的，份数全部翻倍就是大杯，
#                翻倍后也不能超过 20 份
#   page         配方卡的编号，前端找 recipe_<page>.png
#
# 瓶装的另有：
#   karmotrine   酒精份数，0–20 的整数（Mulan Tea 是 0，算无酒精）
#
# 任意两款的配方不能重合，大杯翻倍以后、可选 Karmotrine 加几份都算，否则调出来认不出是哪一款。

