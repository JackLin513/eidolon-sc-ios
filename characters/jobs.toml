# 工作清单（GLOSSARY.md「工作」）。和礼物目录一样由维护者在这里维护，后台和 .env 都不能改；
# 启动时读入、校验，写错了后端起不来。每周北京时间周一 0 点从这里给 7 位偶像各配 2 到 3 项
# （见后端 schedule.py）；已经发布的那一周存进库里，之后改这里只影响还没发布的周。
#
# 每项工作一个 [[jobs]] 段：
#   id        规范标识（小写字母、数字、- 和 _）
#   name      名字，制作人在日历上看到的，一行
#   note      一句说明，一行：制作人看得到，她也拿它当底。不点名角色、不写组合名，地点要写就写进这里
#   category  类别：practice（练习）、appearance（出镜）、business（事务）、private（私人）；
#             工作类（前三类）和私人大约 3:1，每周每位至少一项工作类、最多一项私人
#   length    占几个时间段：1、2 或 3（3 就是一整天，只能从上午排）
#   slots     只能排在哪些时段（可选，不填就是哪段都行）：morning（上午）、afternoon（下午）、
#             evening（晚上）的列表；只给明显不合理的几项加，三段的不能加
#   places    会去哪类地方（可选，不填的那条动态不带地名）：地点池 places.toml 里的类别列表，
#             演出场馆 venue 除外；写 nearby 是去近郊，哪类都行，只挑东京都以外的地点
#
# 清单里不出现「演出」二字：演出只指现实中的 live。

