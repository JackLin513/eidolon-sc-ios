# 礼物目录（GLOSSARY.md「礼物」）。和角色配置一样由维护者在这里维护，后台和 .env 都不能改；
# 启动时读入、校验，写错了后端起不来。
#
# 每件礼物一个 [[gifts]] 段：
#   id        规范标识（小写字母、数字、- 和 _），存进背包和送礼记录的就是它；
#             插画是 frontend/public/gifts/<id>.webp，缺插画测试会失败
#   name      通用中文名
#   category  类别：food（吃的）、drink（饮品）、flower（花草）、trinket（小物件）
#   rarity    稀有度：common（普通）、uncommon（少见）、rare（稀有）；加多少分、多难抽到见后端 affinity.py
#   retired   下架（可选，默认 false）：不再从抽奖里出，已经持有的照样显示、照样能送
#   warm      暖的（可选，默认 false）：她经前、经期时送出额外加好感度，哪里都不提示；
#             含咖啡因的（红茶、奶茶、咖啡）不标
#
# 礼物上线后不删，只能下架；每一档稀有度至少要有一件没下架的，否则那一档抽不出东西。
# 新加一件时照 frontend/public/gifts/CREDITS.md 的提示词骨架生成插画。

