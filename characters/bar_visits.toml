# 酒吧的来意和话题（GLOSSARY.md「来意」「话题」）。和工作清单一样由维护者在这里维护，后台和 .env
# 都不能改，也不让后台模型生成；启动时读入、校验，写错了后端起不来。每次光顾进门时从这里各抽
# 一条（见规格「选角色、来意、话题、杯数」），同一位用户、同一位角色最近 3 次用过的不再抽。
#
# 两张清单都对所有角色通用，具体内容由写戏的模型拿她的人设和资料去填：
#   id        规范标识（小写字母、数字、- 和 _），一张清单里不重复
#   note      一句说明，一行，给模型看的。不点名角色、不写组合名
#   mood      （只有来意有）她进门时的基调：happy（开心）、annoyed（烦躁）、tired（疲惫）、
#             down（低落）、calm（平静）
#   not_for   哪几位角色不用（可选），角色 id 的列表；比如はづき没有组合，不用组合伙伴
#
# 每位角色能用的来意和话题都至少要有 4 条（避开最近 3 次，再加 1）。

# 来意：开心
[[reasons]]
id = "good-news"
note = "有件好事憋了一整天，想第一个说给制作人听。"
mood = "happy"

[[reasons]]
id = "celebrate"
note = "今天有值得庆祝的事，想找制作人喝一杯庆祝。"
mood = "happy"

[[reasons]]
id = "praised"
note = "今天工作上被人夸了，心里美滋滋的，嘴上装作不在意。"
mood = "happy"

[[reasons]]
id = "day-off-tomorrow"
note = "明天难得休息，今晚想放松一下。"
mood = "happy"

[[reasons]]
id = "found-something"
note = "路上发现了一样好东西（一家小店、一个小玩意或一样好吃的），想拿来跟制作人分享。"
mood = "happy"

[[reasons]]
id = "fan-letter"
note = "收到了一封写得很用心的粉丝来信，想找人说说。"
mood = "happy"
not_for = ["hazuki"]

# 来意：烦躁
[[reasons]]
