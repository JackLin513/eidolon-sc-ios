# 酒吧里写死的句子：不交给模型写、由服务器直接挑一句用的。和来意、话题清单一样由维护者在这里维护，
# 后台和 .env 都不能改；启动时读入、校验，写错了后端起不来。
#
# 句子对所有角色通用：她的日语不用第一人称、不叫制作人，口气中性，哪位角色说都不突兀。她的句子是日语
# 加中文字幕（ADR-0001），制作人的只有中文。哪一句都不能出现任何饮品的名字（英文名、日文名都不行，
# 不分大小写、全角半角）；要说名字和条件的，用下面的占位，由服务器填进去。
#
# 她的每一句是一个段，有：
#   ja        日语，一行
#   zh        中文字幕，一行
#   emotion   说这句时的表情（可选，默认 calm）：calm、happy、shy、surprised、sad、angry、thinking
#
# 分这几组，每组至少 3 句，服务器从组里随机挑：
#   enjoy         制作人每上一杯说的「请慢用」，只有中文
#   orders.*      点单的模板句：她点单那句名字检查两次都不过时，换成这种说法的一句。说法：
#                   name 直说饮品名         ja 必须用 {name_ja}，zh 必须用 {name}
#                   name_big 饮品名加大杯   同上，句子里自己说出大杯
#                   flavor 说口味           ja、zh 都必须用 {flavor}
#                   kind 说种类             ja、zh 都必须用 {kind}
#                   conditions 几个条件叠加 ja、zh 都必须用 {conditions}
#                   analogy 照描述打比方    ja、zh 都必须用 {conditions}（填口味和种类：饮品的描述里
#                                           有别的饮品名，模板句不能照着打比方）
#                   my_favorite「来杯我喜欢的」、your_call「你拿主意」、usual「老样子」  不用占位
#   no_alcohol    她要不要酒精时接在点单模板句后面补的一句（几个条件叠加的不用，条件里已经有了）
#   reactions.*   告别那次调用写不出来时，她对最后一杯的反应：best 上得最好、right 上对、wrong 上错
#   farewells.*   同上，她的告别：sober 没醉、drunk 醉了
#
# 占位填进去的样子（由服务器按这一单填）：
#   {name}        英文名，如 Sugar Rush（中文字幕里饮品名不译）
#   {name_ja}     日文名，如 シュガーラッシュ
#   {flavor}      口味，名词性的说法：中文如「甜的」，日语如「甘いの」
#   {kind}        种类，同上：中文如「时尚的」，日语如「おしゃれなの」
#   {conditions}  这一单要提的条件连成一串（口味或种类，加冰、大杯、不要酒精）：中文如
#                 「甜的、加冰、不要酒精」，日语如「甘いの、氷入り、アルコール抜き」
# 所以句子里占位的前后要接得上这种说法，比如中文不要写「{conditions}的」（会变成「时尚的的」）。

enjoy = [
  "请慢用。",
  "久等了，请慢用。",
  "做好了，请慢用。",
  "你的这杯，请慢用。",
  "好了，慢慢喝。",
]

# 点单的模板句

[[orders.name]]
ja = "{name_ja}、お願いします。"
zh = "{name}，麻烦了。"

[[orders.name]]
ja = "じゃあ、{name_ja}で。"
zh = "那就 {name} 吧。"

[[orders.name]]
ja = "今日は{name_ja}の気分。"
zh = "今天想喝 {name}。"

[[orders.name_big]]
ja = "{name_ja}、大きいサイズでお願いします。"
zh = "{name}，要大杯的，麻烦了。"

[[orders.name_big]]
ja = "{name_ja}を大きいグラスで。"
zh = "{name}，用大杯。"

[[orders.name_big]]
ja = "今日は{name_ja}、大きいほうで。"
zh = "今天要 {name}，大杯的。"

[[orders.flavor]]
ja = "{flavor}、お願いします。"
zh = "来一杯{flavor}吧。"

[[orders.flavor]]
ja = "今日は{flavor}がいいな。"
zh = "今天想喝{flavor}。"

[[orders.flavor]]
ja = "何か{flavor}を一杯。"
zh = "随便来一杯{flavor}。"

[[orders.kind]]
ja = "{kind}、お願いします。"
zh = "来一杯{kind}吧。"

[[orders.kind]]
ja = "今日は{kind}がいいな。"
zh = "今天想要{kind}。"

[[orders.kind]]
ja = "そうだな……{kind}を一杯。"
zh = "这个嘛……来一杯{kind}。"

[[orders.conditions]]
ja = "{conditions}で、お願いします。"
zh = "要{conditions}，麻烦了。"

[[orders.conditions]]
ja = "えっと……{conditions}。そういうのを一杯。"
zh = "嗯……{conditions}。来一杯这样的。"

[[orders.conditions]]
ja = "今日は{conditions}、って気分。"
zh = "今天的心情是——{conditions}。"

[[orders.analogy]]
ja = "名前が出てこなくて……{conditions}、みたいな感じの。"
zh = "名字想不起来了……大概是{conditions}那种。"
emotion = "thinking"

[[orders.analogy]]
ja = "うまく言えないけど……{conditions}、そんな一杯を。"
zh = "说不太清楚……{conditions}，来一杯那样的。"
emotion = "thinking"

[[orders.analogy]]
ja = "説明が難しいな……{conditions}、っていう感じで。"
zh = "不太好形容……{conditions}，大概是这样。"
emotion = "thinking"

[[orders.my_favorite]]
ja = "好きなの、お願いします。"
zh = "来一杯我喜欢的吧。"
emotion = "happy"

[[orders.my_favorite]]
ja = "好きなもの、覚えてます？それで。"
zh = "我喜欢喝什么，还记得吧？就那个。"
emotion = "happy"

[[orders.my_favorite]]
ja = "今日は、好きなのが飲みたいな。"
zh = "今天想喝我喜欢的。"

[[orders.your_call]]
ja = "おまかせで。"
zh = "你来定吧。"

[[orders.your_call]]
ja = "今日は任せます。何でも。"
zh = "今天交给你了，什么都行。"

[[orders.your_call]]
ja = "何がいいかな……選んでもらえますか？"
zh = "喝什么好呢……你帮我挑吧？"
emotion = "thinking"

[[orders.usual]]
ja = "いつもの、お願いします。"
zh = "老样子，麻烦了。"

[[orders.usual]]
ja = "この前と同じので。"
zh = "和上次一样的。"

[[orders.usual]]
ja = "前に飲んだの、また飲みたいな。"
zh = "上次喝的那个，想再来一杯。"
emotion = "happy"

# 不要酒精

[[no_alcohol]]
ja = "あ、アルコールは抜きで。"
zh = "啊，不要加酒精。"

[[no_alcohol]]
ja = "それと、お酒は入れないでください。"
zh = "还有，别放酒。"

[[no_alcohol]]
ja = "あと、ノンアルコールでお願いします。"
zh = "另外，要无酒精的，麻烦了。"

