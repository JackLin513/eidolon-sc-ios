name: EidolonIOS

options:
  bundleIdPrefix: com.jacklin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1

packages:
  EidolonCore:
    path: EidolonCore

targets:
  EidolonIOS:
    type: application
    platform: iOS
    dependencies:
      - package: EidolonCore
    sources:
      - path: EidolonIOS
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon
        PRODUCT_NAME: Eidolon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: EidolonIOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "MFZ8WGP52J"
        # 立绘运行时在构建时从上游 checkout 拷进构建产物（ADR-0017），那个路径在
        # SRCROOT 之外，脚本沙箱会挡住；下面的脚本只读那一个文件。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: 同步 Spine 运行时
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/tools/sync_stand_runtime.sh" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" \
            "${EIDOLON_UPSTREAM:-${SRCROOT}/../eidolon-sc}"

schemes:
  EidolonIOS:
    build:
      targets:
        EidolonIOS: all
    run:
      config: Debug
