name: EidolonIOS

options:
  bundleIdPrefix: com.jacklin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1

packages:
  EidolonCore:
    path: EidolonCore

targets:
  EidolonIOS:
    type: application
    platform: iOS
    dependencies:
      - package: EidolonCore
      # Unity as a Library（ADR-0034）。framework 由 spikes/porting-3d/unity-spike 的
      # iOS 导出构建后拷到这里（不进仓库），缺它时 xcodegen 会报错。
      # 只 embed、不 link：UaaL 要求 App 启动时不要 dyld 自动加载 UnityFramework，
      # 否则 Unity 的静态初始化会在 runUI 之前跑，模拟器/真机都会闪退。
      - framework: EidolonIOS/UnityRuntime/UnityFramework.framework
        embed: true
        codeSign: true
        link: false
    sources:
      - path: EidolonIOS
        excludes:
          - Info.plist
          # 欢迎页（spec #118）的页面和素材要保留目录结构，见下面的 folder reference
          - Resources/WelcomePage
          - Resources/Welcome
          # Unity 的 Data 目录要保持名字做 folder reference
          - Resources/Unity
          # UnityFramework 由上面的 framework dependency 单独嵌入，不走 sources
          - UnityRuntime
      - path: EidolonIOS/Resources/WelcomePage
        type: folder
      - path: EidolonIOS/Resources/Welcome
        type: folder
      # Unity 运行时的 Data 目录（Unity 导出产物拷贝，bundle 根下名为 Data）
      - path: EidolonIOS/Resources/Unity/Data
        type: folder
      # 3D 立绘内容（tools/fetch_unity3d_content.py 产物，bundle 根下名为 Unity3DContent）
      - path: build/Unity3DContent
        type: folder
      - path: AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon
        PRODUCT_NAME: Eidolon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: EidolonIOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "FF7NMQWZKK"
        # AVFAudio 的安装 tap 会以 Objective-C 异常失败，Swift 接不住；一个 ObjC 兜底
        # 把闪退变成一次失败的恢复。
        SWIFT_OBJC_BRIDGING_HEADER: EidolonIOS/Support/EidolonIOS-Bridging-Header.h
        # Unity 的 framework 里有 ObjC category，链接时不能把没显式引用的类丢掉
        OTHER_LDFLAGS: $(inherited) -ObjC
        FRAMEWORK_SEARCH_PATHS: $(inherited) "$(SRCROOT)/EidolonIOS/UnityRuntime"
        HEADER_SEARCH_PATHS: $(inherited) "$(SRCROOT)/EidolonIOS/UnityRuntime" "$(SRCROOT)/EidolonIOS/UnityRuntime/UnityFramework.framework/Headers"
        # Xcode 26 的 Debug dylib 拆分会让 C/ObjC 插件符号（EidolonUnityStart、
        # _mh_execute_header）在链接阶段找不到；Unity 嵌入走单二进制。
        ENABLE_DEBUG_DYLIB: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        # 立绘运行时在构建时从上游 checkout 拷进构建产物（ADR-0017），那个路径在
        # SRCROOT 之外，脚本沙箱会挡住；下面的脚本只读那一个文件。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: 同步 Spine 运行时
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/tools/sync_stand_runtime.sh" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" \
            ${EIDOLON_UPSTREAM:+"$EIDOLON_UPSTREAM"}

  EidolonIOSTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: EidolonIOS
    sources:
      - path: EidolonIOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Eidolon.app/Eidolon
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "FF7NMQWZKK"

  EidolonIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: EidolonIOS
    sources:
      - path: EidolonIOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EidolonIOS
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "FF7NMQWZKK"

schemes:
  EidolonIOS:
    build:
      targets:
        EidolonIOS: all
        EidolonIOSTests: [test]
        EidolonIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EidolonIOSTests
        - EidolonIOSUITests
