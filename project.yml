name: EidolonIOS

options:
  bundleIdPrefix: com.jacklin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1

packages:
  EidolonCore:
    path: EidolonCore

targets:
  EidolonIOS:
    type: application
    platform: iOS
    dependencies:
      - package: EidolonCore
    sources:
      - path: EidolonIOS
        excludes:
          - Info.plist
      - path: AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon
        PRODUCT_NAME: Eidolon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: EidolonIOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "FF7NMQWZKK"
        # 立绘运行时在构建时从上游 checkout 拷进构建产物（ADR-0017），那个路径在
        # SRCROOT 之外，脚本沙箱会挡住；下面的脚本只读那一个文件。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: 同步 Spine 运行时
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/tools/sync_stand_runtime.sh" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" \
            "${EIDOLON_UPSTREAM:-${SRCROOT}/../eidolon-sc}"

  EidolonIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: EidolonIOS
    sources:
      - path: EidolonIOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EidolonIOS
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "FF7NMQWZKK"

  Eidolon3DSpike:
    type: application
    platform: iOS
    dependencies:
      - package: EidolonCore
    sources:
      - path: spikes/porting-3d/ios
        excludes:
          - tests
          - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon3dspike
        PRODUCT_NAME: Eidolon3DSpike
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "0.3"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "MFZ8WGP52J"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Copy 3D preview resources
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          for name in mirai-pr001.usdz mirai-ss003.usdz; do
            src="${SRCROOT}/spikes/porting-3d/ios/Resources/${name}"
            if [ -f "$src" ]; then
              cp "$src" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/${name}"
            fi
          done

  Eidolon3DSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: spikes/porting-3d/ios/tests
    dependencies:
      - target: Eidolon3DSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon3dspike.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EidolonIOS:
    build:
      targets:
        EidolonIOS: all
        EidolonIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EidolonIOSUITests

  Eidolon3DSpike:
    build:
      targets:
        Eidolon3DSpike: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Eidolon3DSpikeTests
