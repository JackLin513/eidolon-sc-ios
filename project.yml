name: EidolonIOS

options:
  bundleIdPrefix: com.jacklin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1

packages:
  EidolonCore:
    path: EidolonCore

targets:
  EidolonIOS:
    type: application
    platform: iOS
    dependencies:
      - package: EidolonCore
    sources:
      - path: EidolonIOS
        excludes:
          - Info.plist
          # 欢迎页（spec #118）的页面和素材要保留目录结构，见下面的 folder reference
          - Resources/WelcomePage
          - Resources/Welcome
      - path: EidolonIOS/Resources/WelcomePage
        type: folder
      - path: EidolonIOS/Resources/Welcome
        type: folder
      - path: AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon
        PRODUCT_NAME: Eidolon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: EidolonIOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "FF7NMQWZKK"
        # AVFAudio 的安装 tap 会以 Objective-C 异常失败，Swift 接不住；一个 ObjC 兜底
        # 把闪退变成一次失败的恢复。
        SWIFT_OBJC_BRIDGING_HEADER: EidolonIOS/Support/EidolonIOS-Bridging-Header.h
        # 立绘运行时在构建时从上游 checkout 拷进构建产物（ADR-0017），那个路径在
        # SRCROOT 之外，脚本沙箱会挡住；下面的脚本只读那一个文件。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: 同步 Spine 运行时
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/tools/sync_stand_runtime.sh" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" \
            "${EIDOLON_UPSTREAM:-${SRCROOT}/../eidolon-sc}"

  EidolonIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: EidolonIOS
    sources:
      - path: EidolonIOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklin.eidolon.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EidolonIOS
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "FF7NMQWZKK"

schemes:
  EidolonIOS:
    build:
      targets:
        EidolonIOS: all
        EidolonIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EidolonIOSUITests
