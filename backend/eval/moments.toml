# 朋友圈评测集（`eidolon eval moments --html <文件>`）：发动态 12 个场景、回评论 6 个场景，
# 每个场景写好这次给她的全部素材，命令照线上拼提示词、照线上解析，结果写进 HTML 给人读。
# 记忆、日程、最近的动态都是编的，不用剧情原文（ADR-0003）；资料种子照线上的写法取自角色资料。
#
# 两个场景共用的项：
#   id          场景标识，不重复
#   about       这个场景看什么，HTML 里显示
#   character   角色标识
#   tier        好感度档位：trust（默认）、close、intimate
#   at          东京时间，带时区，例如 2026-11-12T19:20:00+09:00
#   producer    制作人资料（可选）：{ address = "称呼", gender = "male" 或 "female",
#               birthday = "MM-DD", timezone = "Asia/Shanghai" }，不写时区按 Asia/Shanghai
#   cycle       周期（可选）：period（经期第 1 天）或 premenstrual（经前 2 天）
#   today       「今天」那几行，照 today_lines 的原话写（生日、节假日、往年今天的演出）
#   memories    她听制作人说过的事：{ text = "…", on = 2026-11-09 }，按给她的先后
#
# 发动态（[[post]]）另有：
#   weather       { kind = "clear"/"cloudy"/"overcast"/"fog"/"rain"/"snow"/"thunder", temperature = 15 }，
#                 不写就是没取到
#   birthday      今天是不是她的生日（true 时名单的上限放宽）
#   jobs / seeds  工作那条写今天做完的工作（「名字：note」），日常那条写 3 条资料种子，只写一样
#   recent        她最近的动态，最新的在前：{ ja = "…", note = "配图写的 note" }，note 可以不写
#   circle        圈子成员的角色标识；她资料「人物关系」里关于这个人的那一节由命令照线上取
#   places        地点候选，地点池里的 id；不写就是没有候选
#   compositions  这次允许的构图（scenery、food、object、selfie、posed、candid、group）；不写就是纯文字
#   novelai       是不是 NovelAI 形态（默认 true）；合照只在 NovelAI 形态下允许
#
# 回评论（[[reply]]）另有：
#   history   当前对话最后几个回合：{ user = "…" } 或 { ja = "…", zh = "…" }
#   moment    这条动态：{ ja = "…", note = "…" }
#   likes     已经露出的偶像的赞，角色标识
#   comments  已经露出的偶像评论：{ from = "角色标识", ja = "…" }
#   liked     他赞没赞
#   comment   他的评论原话

